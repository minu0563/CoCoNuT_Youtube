<!doctype html>
<html lang="ko" data-theme="light">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube Setting</title>
  <link rel="stylesheet" href="../css/main.css">
</head>

<body>
  <header class="header">

    <div class="brand">
      <div>
        <div class="title" id="settingtitle"></div>
      </div>
    </div>
    <p id="back" style="font-size: 18px;vertical-align:middle;margin:0; padding-right: 2px; cursor: pointer;">X</p>

  </header>

  <main class="container">

    <section class="card">
      <div class="shortcut">
        <div class="row">
          <div>
            <div class="label" id="shortcutLabel"></div>
            <div class="help" id="shortcutHelp"></div>
          </div>
          <a id="shortlink" href="#" class="btn"><span id="goshortcut"></span></a>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="shortcut">
        <div class="row">
          <div>
            <div class="label" id="changeColorLabel"></div>
            <div class="help" id="changeColorHelp"></div>
          </div>
          <div class="btn" id="changeColorBtn">
            <input type="color" id="colorPicker" hidden>
            <span id="changeColor"></span>
          </div>
        </div>
      </div>
    </section>

    <button id="reset" class="reset floating" aria-label="Reset">
      <span id="resetLabel"></span>
    </button>

    <script src="../js/index.js"></script>
  </main>
</body>

</html>
